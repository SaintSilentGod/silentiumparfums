<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Silentium</title>
    <meta name="description" content="Silentium — парфюмерия, рождённая из эмоций" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Mono:wght@300;400;500&family=Ruslan+Display&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;600&family=Unbounded:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Manrope:wght@200;300;400;600&family=Yeseva+One&family=Cormorant+SC:wght@500;700&family=Rubik+Mono+One&family=Tenor+Sans&family=Oswald:wght@400;600;700&family=Forum&family=Jost:wght@200;300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Prata&family=Montserrat:ital,wght@0,300;0,500;1,800;1,900&display=swap" rel="stylesheet" />
    <script>
      // A tab kept from an older deploy can point at a stylesheet that no longer exists; Cloudflare then
      // answers with index.html and the page renders unstyled. Detect that and reload once for fresh HTML.
      addEventListener("load", function () {
        try {
          var p = document.createElement("div"); p.className = "absolute"; document.body.appendChild(p);
          var ok = getComputedStyle(p).position === "absolute"; p.remove();
          if (ok) sessionStorage.removeItem("css-heal");
          else if (!sessionStorage.getItem("css-heal")) { sessionStorage.setItem("css-heal", "1"); location.reload(); }
        } catch (e) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
